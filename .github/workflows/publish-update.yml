name: Publish signed update
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (for example v0.5.0)'
        required: true
permissions:
  contents: write
concurrency:
  group: publish-signed-update
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/update-assets"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Stable published release required") else true end'
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/update-assets" --pattern 'UltimateDownloaderPro-*.zip' --pattern 'update-manifest.json'
      - name: Verify signature and publish feed
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 Tools/publish_appcast.py "$RUNNER_TEMP/update-assets" "$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/appcast.xml
          git commit -m 'Publish verified update feed'
          git push origin HEAD:main
