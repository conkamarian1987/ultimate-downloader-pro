name: Hlášení chyby
description: Nahlaste opakovatelný problém v aplikaci.
title: "[Chyba] "
labels: ["chyba"]
body:
  - type: markdown
    attributes:
      value: "Děkujeme za přesné hlášení. Nevkládejte cookies, hesla ani osobní údaje."
  - type: input
    id: version
    attributes:
      label: Verze aplikace
      placeholder: "Beta 0.3.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Verze macOS a typ Macu
      placeholder: "macOS 15.6, Apple M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Postup pro zopakování
      description: Popište jednotlivé kroky a použitou službu.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Očekávaný výsledek
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Skutečný výsledek
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Protokol
      description: Před vložením odstraňte tokeny, cookies a osobní cesty.
      render: shell

